# Ambiente de desenvolvimento com recarga automática.
# Uso: docker compose -f docker-compose.dev.yml watch
#   frontend → http://localhost:5173   |   API → http://localhost:3333/api
name: bruvet-dev

services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: file:/app/data/bruvet.db
      DATA_DIR: /app/data
      # Login inicial de desenvolvimento (troca de senha exigida no primeiro acesso)
      ADMIN_EMAIL: admin@bruvet.local
      ADMIN_PASSWORD: admin12345
    ports:
      - "3333:3333"
    volumes:
      - bruvet-dev-data:/app/data
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          ignore:
            - generated/
        # Mudou o schema: reinicia para regenerar o client e aplicar migrations
        - action: sync+restart
          path: ./backend/prisma
          target: /app/prisma
        - action: rebuild
          path: ./backend/package.json

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:3333
    ports:
      - "5173:5173"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json

volumes:
  bruvet-dev-data:
